<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상호 피드백 시연</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f3f1ec; --paper:#fff; --ink:#22201c; --muted:#6f6a61; --line:#e2ddd3;
  --accent:#3d5a80; --hl:rgba(255,206,64,.38); --hl-on:rgba(255,140,40,.45);
  --card:#fff; --danger:#a33;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .cnt{font-size:12px;opacity:.75;margin-left:4px}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.me select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.me select.need{border-color:#e8932a;box-shadow:0 0 0 3px rgba(232,147,42,.25)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;height:calc(100% - 57px)}
#viewer{overflow:auto;padding:20px 16px 80px;position:relative}
#pages{max-width:820px;margin:0 auto}
.page{position:relative;margin:0 auto 18px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);-webkit-user-drag:none}
.page canvas{display:block;width:100%;height:auto;pointer-events:none}
.hl-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.hl{position:absolute;background:var(--hl);border-radius:2px;mix-blend-mode:multiply}
.hl.on{background:var(--hl-on)}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(61,90,128,.3)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}
#addBtn{position:absolute;z-index:30;display:none;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
aside{border-left:1px solid var(--line);background:#faf9f6;overflow:auto;padding:14px}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side-head b{font-size:15px}
.ghost{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:6px 14px;font-size:14px}
.primary:disabled,.ghost:disabled{opacity:.5;cursor:default}
.composer{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:12px}
.composer .q,.memo .q{font-size:13px;color:var(--muted);border-left:3px solid #f0c340;padding:2px 8px;margin:0 0 8px;max-height:4.8em;overflow:hidden}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.memo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.memo.on{border-color:#e8932a;box-shadow:0 0 0 2px rgba(232,147,42,.25)}
.meta{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:4px}
.meta .who{font-weight:700;color:var(--ink)}
.meta .who.t{color:#b4235a}
.jo-pick{font:inherit;font-weight:700;font-size:16px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.demo-badge{font-size:12px;background:#fde68a;color:#7c4a03;border-radius:999px;padding:2px 10px;white-space:nowrap}
.me .fixed{font-weight:700;color:#b4235a}
.meta .pg{margin-left:auto}
.body{white-space:pre-wrap;word-break:break-word}
.reply{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.replybox{margin-top:8px}
.replybox textarea{min-height:56px}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
.del{background:none;border:0;color:var(--danger);padding:0;font-size:12px;margin-left:6px}
.empty{color:var(--muted);font-size:14px;padding:20px 4px}
.notice{max-width:520px;margin:15vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center}
.gate{max-width:520px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.gate b{color:var(--ink)}
.loading{color:var(--muted);text-align:center;padding:40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;display:none;max-width:90vw}
.help{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.rule{font-size:12px;color:var(--muted);margin:6px 0 0}
@media (max-width:860px){
  main{display:block;height:auto}
  #viewer{padding:12px 8px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .me{margin-left:0}
}
@media print{ body *{display:none !important} body::before{content:"이 화면은 인쇄할 수 없습니다.";display:block;padding:40px;font-size:18px} }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script>
// 시연용 페이지. 서버에 연결하지 않고, 쓴 메모는 이 브라우저 화면에만 잠깐 남는다(새로고침하면 처음 상태).
var GROUP_TOKEN = 'demo';
var TEACHER_KEY = '';
var TEACHER_NICK = '사랑의하츄핑';
</script>
<script>
(function(){
'use strict';
var S = { jo:null, essays:[], cur:null, memos:[], counts:{}, active:null, draft:null, me:'', pageEls:[], open:true, from:null, until:null, replyMeta:{}, loadSeq:0 };
var mine = load('mine') || {};          // {id: secret}

function load(k){ try{ return JSON.parse(localStorage.getItem('fbdemo_'+k)); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem('fbdemo_'+k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
/* ---------- 시연용 가짜 서버 ---------- */
var DEMO_MEMBERS = ['라라핑','바로핑','해핑','차차핑'];
var DEMO_ESSAYS = [{nick:'라라핑', pages:1, file:'lala'}, {nick:'바로핑', pages:1, file:'baro'}];
var T0 = Date.now() - 3*3600*1000, seq = 0;
function seed(essay, author, quote, body, parent, mins){ var id='d'+(++seq); MEMOS.push({id:id, time:T0+mins*60000, essay:essay, author:author, page:quote?1:null, quote:quote||'', body:body, parent:parent||null, rects:null}); return id; }
var MEMOS = [];
(function(){
  var a = seed('라라핑','해핑','친구들에게 물어보니 비슷하게 고른다는 사람이 꽤 많았다.','몇 명에게 물어봤는지 적어 주면 더 설득력 있을 것 같아요. ‘꽤 많았다’는 읽는 사람마다 다르게 받아들일 수 있어서요.',null,5);
  seed('라라핑','라라핑','','다섯 명한테 물어봤는데 네 명이 4.6을 골랐어요. 숫자로 바꿔서 써 볼게요!',a,40);
  seed('라라핑','차차핑','정보가 없으면 사람은 안심하기보다 무엇이 가려져 있는지를 먼저 상상한다.','이 문장이 글 전체에서 제일 좋았어요. 서론에서 이 생각을 먼저 살짝 보여 주면 어떨까요?',null,12);
  var c = seed('라라핑','바로핑','리뷰 이벤트로 음료를 주고 별 다섯 개를 받는 일이 흔하다는 것을 이제는 대부분 안다.','‘대부분 안다’는 근거가 없어서 조금 단정적으로 느껴져요. 실제 리뷰 이벤트 안내 문구를 하나 예로 들면 좋겠어요.',null,20);
  seed('라라핑','해핑','','저도 같은 생각이에요. 배달 앱 화면을 캡처해서 설명하는 것도 방법일 듯!',c,26);
  var d = seed('라라핑','사랑의하츄핑','','세 가지 이유가 ‘정보, 연출에 대한 의심, 점수의 안정성’으로 잘 나뉘어 있어요. 다만 마지막 문단의 가게 이야기는 글의 질문(왜 4.6에 끌릴까)에서 조금 벗어나니, 결론을 소비자 쪽 이야기로 마무리할지 고민해 보세요.',null,60);
  seed('바로핑','라라핑','학생들이 원하는 것은 수업에서 도망치는 것이 아니라, 수업에 참여하는 정도를 스스로 정할 수 있는 여지다.','공감돼요. 이 문장이 이 글의 핵심 주장 같아요. 제목 아래 부제에 이 내용을 담아도 좋겠어요.',null,15);
  seed('바로핑','차차핑','','세 번째 이유(습관)는 앞의 두 이유와 성격이 조금 달라요. 처음에 왜 뒷자리를 고르는지와 왜 계속 그 자리에 앉는지를 나눠서 설명하면 더 깔끔할 것 같아요.',null,33);
})();
function get(q){ return Promise.resolve({q:q}); }
function post(b){ return Promise.resolve({b:b}); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function listOf(essay){ return clone(MEMOS.filter(function(m){ return m.essay===essay; })); }
function route(req){
  var q=req.q, b=req.b;
  if(q && q.api==='group') return {jo:'시연', essays:DEMO_ESSAYS.map(function(e){return {nick:e.nick, pages:e.pages};}), members:DEMO_MEMBERS, open:true};
  if(q && q.api==='comments') return listOf(q.essay);
  if(q && q.api==='page'){ var e=DEMO_ESSAYS.filter(function(x){return x.nick===q.essay;})[0];
    return fetch('data/'+e.file+'_p'+q.n+'.json').then(function(r){ if(!r.ok) throw new Error('글을 불러오지 못했습니다.'); return r.json(); }); }
  if(b && b.action==='add'){ var m=b.m; var id='u'+Date.now();
    MEMOS.push({id:id, time:Date.now(), essay:m.essay, author:m.author, page:m.page||null, quote:m.quote||'', body:m.body, parent:m.parent||null, rects:m.rects||[]});
    return {id:id, secret:'demo', list:listOf(m.essay)}; }
  if(b && b.action==='delete'){ MEMOS=MEMOS.filter(function(m){ return m.id!==b.id && m.parent!==b.id; }); return listOf(b.essay); }
  throw new Error('알 수 없는 요청입니다.');
}
function call(req){ return req.then(function(r){ return new Promise(function(res){ setTimeout(function(){ res(route(r)); }, 250); }); }); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},2800); }
function fmt(ms){ if(!ms) return ''; var d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function inField(el){ return el && el.closest && el.closest('textarea,select,input'); }

/* ---------- 저장·복사·인쇄 막기 (메모 칸은 예외) ---------- */
document.addEventListener('contextmenu', function(e){ if(!inField(e.target)) e.preventDefault(); });
document.addEventListener('copy', function(e){ if(!inField(e.target)) { e.preventDefault(); toast('글은 복사할 수 없습니다.'); } });
document.addEventListener('cut', function(e){ if(!inField(e.target)) e.preventDefault(); });
document.addEventListener('dragstart', function(e){ if(!inField(e.target)) e.preventDefault(); });
document.addEventListener('keydown', function(e){
  var k=(e.key||'').toLowerCase(), mod=e.ctrlKey||e.metaKey;
  if(mod && (k==='s'||k==='p'||k==='u')){ e.preventDefault(); toast('저장·인쇄는 할 수 없습니다.'); }
  if(mod && k==='c' && !inField(e.target)){ e.preventDefault(); toast('글은 복사할 수 없습니다.'); }
}, true);

/* ---------- 메모 칸 입력 기록 (붙여넣기 금지) ---------- */
var ACTIVE = [];   // 작성 중인 메모들의 기록
function goAway(){ var t=Date.now(); ACTIVE.forEach(function(m){ if(!m._a){ m.away++; m._a=t; } }); }
function comeBack(){ var t=Date.now(); ACTIVE.forEach(function(m){ if(m._a){ m.awayMs+=t-m._a; m._a=0; } }); }
window.addEventListener('blur', goAway);
window.addEventListener('focus', comeBack);
document.addEventListener('visibilitychange', function(){ if(document.hidden) goAway(); else comeBack(); });
function track(ta, meta){
  ta.addEventListener('focus', function(){ if(!meta.started){ meta.started=Date.now(); ACTIVE.push(meta); } });
  ta.addEventListener('paste', function(e){ e.preventDefault(); meta.pastes++; toast('붙여넣기는 할 수 없습니다. 직접 써 주세요.'); });
  ta.addEventListener('drop', function(e){ e.preventDefault(); meta.pastes++; toast('끌어다 놓기는 할 수 없습니다. 직접 써 주세요.'); });
  ta.addEventListener('keydown', function(){ meta.keys++; });
  ta.addEventListener('focus', function(){ meta._f=Date.now(); });
  ta.addEventListener('blur', function(){ if(meta._f){ meta.ms+=Date.now()-meta._f; meta._f=0; } });
}
function newMeta(){ return {ms:0, keys:0, pastes:0, _f:0, away:0, awayMs:0, _a:0, started:0}; }
function metaOut(meta){ var ms=meta.ms+(meta._f?Date.now()-meta._f:0); comeBack(); ACTIVE=ACTIVE.filter(function(m){return m!==meta;});
  return {ms:ms, keys:meta.keys, pastes:meta.pastes, away:meta.away, awayMs:meta.awayMs}; }

/* ---------- 시작 ---------- */
function start(){
  if(TEACHER_KEY){
    return call(get({api:'groups'})).then(function(list){
      S.groups=list; var last=load('t_group');
      GROUP_TOKEN = (list.filter(function(x){return x.g===last;})[0] || list[0]).g;
      loadGroup();
    }).catch(function(e){ notice('들어갈 수 없습니다', e.message); });
  }
  if(!GROUP_TOKEN){ return notice('조별 링크로 들어와 주세요.','선생님이 나눠 준 우리 조 링크를 열면 같은 조 친구들의 글을 볼 수 있습니다.'); }
  loadGroup();
}
function loadGroup(){
  S.loadSeq++; S.cur=null; S.counts={}; S.memos=[]; S.draft=null; S.active=null;
  call(get({api:'group', g:GROUP_TOKEN})).then(function(g){
    S.jo=g.jo; S.essays=g.essays; S.open=g.open; S.from=g.from; S.until=g.until; S.teacher=!!g.teacher;
    if(S.teacher) S.me=TEACHER_NICK;
    S.members = g.members || g.essays.map(function(e){return e.nick;});
    S.me = '';
    shell();
    var last = load('cur_'+S.jo);
    var first = g.essays.filter(function(e){return e.nick===last;})[0] || g.essays.filter(function(e){return e.nick!==S.me;})[0] || g.essays[0];
    if(first) openEssay(first.nick);
  }).catch(function(e){ notice('들어갈 수 없습니다', e.message); });
}
function notice(t,m){ document.getElementById('app').innerHTML='<div class="notice"><h2>'+esc(t)+'</h2><p>'+esc(m)+'</p></div>'; }
function periodText(){
  var f=function(ms){ var d=new Date(ms); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
  if(S.from && Date.now()<S.from) return f(S.from)+'부터 열립니다.';
  if(S.until && Date.now()>S.until) return f(S.until)+'에 마감되었습니다.';
  return '';
}

function shell(){
  var title = S.teacher
    ? '<h1><select class="jo-pick" id="jo">'+S.groups.map(function(x){ return '<option value="'+esc(x.g)+'"'+(x.g===GROUP_TOKEN?' selected':'')+'>'+x.jo+'조</option>'; }).join('')+'</select> 상호 피드백</h1>'
    : '<h1>'+S.jo+'조 상호 피드백 <span class="demo-badge">시연용 · 저장되지 않음</span></h1>';
  var who = S.teacher ? '<span class="me">나는 <span class="fixed">'+esc(TEACHER_NICK)+'</span></span>' : null;
  var opts = '<option value="">닉네임 선택</option>' + S.members.map(function(n){ return '<option'+(n===S.me?' selected':'')+'>'+esc(n)+'</option>'; }).join('');
  document.getElementById('app').innerHTML =
    '<header>'+title+
    '<div class="tabs" id="tabs" role="tablist"></div>'+
    (who || '<label class="me">나는 <select id="me"'+(S.me?'':' class="need"')+'>'+opts+'</select></label>')+'</header>'+
    '<main><section id="viewer"><div id="pages"></div><button id="addBtn" type="button">＋ 메모 달기</button></section>'+
    '<aside id="side"></aside></main>';
  var jo=document.getElementById('jo');
  if(jo) jo.addEventListener('change', function(){ GROUP_TOKEN=this.value; save('t_group',GROUP_TOKEN); document.getElementById('pages').innerHTML='<div class="loading">불러오는 중…</div>'; loadGroup(); });
  if(!S.teacher) document.getElementById('me').addEventListener('change', function(){
    S.me=this.value; save('me_'+S.jo,S.me); this.classList.toggle('need', !S.me);
    if(S.cur) openEssay(S.cur); else { renderTabs(); renderSide(); }
  });
  document.getElementById('addBtn').addEventListener('mousedown', function(e){ e.preventDefault(); });
  document.getElementById('addBtn').addEventListener('click', startDraftFromSelection);
  document.getElementById('viewer').addEventListener('scroll', function(){ hideAdd(); });
  renderTabs();
  if(S.wired) return; S.wired=true;
  document.addEventListener('selectionchange', onSel);
  setInterval(function(){ if(S.cur && !document.hidden && !S.draft) refresh(); }, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.cur && !S.draft) refresh(); });
}
function renderTabs(){
  var el=document.getElementById('tabs');
  el.innerHTML = S.essays.map(function(e){
    var c=S.counts[e.nick]; var mineMark = e.nick===S.me ? ' (내 글)' : '';
    return '<button class="tab" role="tab" aria-selected="'+(e.nick===S.cur)+'" data-n="'+esc(e.nick)+'">'+esc(e.nick)+mineMark+(c!=null?'<span class="cnt">'+c+'</span>':'')+'</button>';
  }).join('');
  [].forEach.call(el.querySelectorAll('.tab'), function(b){ b.onclick=function(){ openEssay(b.getAttribute('data-n')); }; });
}

/* ---------- 글 불러오기 (쪽 그림 + 글자 위치, PDF 없음) ---------- */
function openEssay(nick){
  var e=S.essays.filter(function(x){return x.nick===nick;})[0]; if(!e) return;
  var seq=++S.loadSeq;
  S.cur=nick; S.active=null; S.draft=null; S.memos=[]; S.pageEls=[]; save('cur_'+S.jo,nick);
  renderTabs(); renderSide();
  var wrap=document.getElementById('pages'); document.getElementById('viewer').scrollTop=0;
  if(!S.me){ wrap.innerHTML='<div class="gate"><b>먼저 위쪽 ‘나는’ 칸에서 내 닉네임을 골라 주세요.</b><p>닉네임을 고르면 글이 나타납니다. 글 위에는 내 닉네임이 옅게 표시됩니다.</p></div>'; return; }
  if(!S.open){ wrap.innerHTML='<div class="gate"><b>지금은 열람 기간이 아닙니다.</b><p>'+esc(periodText())+'</p></div>'; return; }
  wrap.innerHTML='<div class="loading">글을 불러오는 중…</div>';
  call(get({api:'comments', g:GROUP_TOKEN, essay:nick})).then(function(list){
    if(seq!==S.loadSeq) return; S.memos=list; S.counts[nick]=topLevel().length; renderTabs(); renderSide(); drawHighlights();
  }).catch(function(){});
  var width = Math.min(wrap.clientWidth || 800, 820);
  var chain=Promise.resolve(), first=true;
  for(var i=1;i<=e.pages;i++) (function(n){
    chain=chain.then(function(){
      if(seq!==S.loadSeq) return;
      return call(get({api:'page', g:GROUP_TOKEN, essay:nick, n:n, viewer:S.me})).then(function(pg){
        if(seq!==S.loadSeq) return;
        if(first){ wrap.innerHTML=''; first=false; }
        return renderPage(wrap, n, pg, width);
      });
    });
  })(i);
  chain.catch(function(err){ if(seq===S.loadSeq) wrap.innerHTML='<div class="loading">불러오지 못했습니다: '+esc(err.message)+'</div>'; });
}
function renderPage(wrap, n, pg, width){
  var scale=width/pg.w, W=pg.w*scale, H=pg.h*scale;
  var div=document.createElement('div'); div.className='page'; div.dataset.page=n;
  div.style.width=W+'px'; div.style.height=H+'px'; div.style.setProperty('--scale-factor', scale);
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement('canvas'); cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  var hl=document.createElement('div'); hl.className='hl-layer';
  var tl=document.createElement('div'); tl.className='textLayer';
  div.appendChild(cv); div.appendChild(hl); div.appendChild(tl); wrap.appendChild(div); S.pageEls[n]=div;
  tl.addEventListener('click', onTextClick);
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      var ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height); watermark(ctx,cv.width,cv.height,dpr);
      img.src='';
      var vp={scale:scale, rotation:0, rawDims:{pageWidth:pg.w, pageHeight:pg.h, pageX:0, pageY:0}};
      pdfjsLib.renderTextLayer({textContentSource:pg.text, container:tl, viewport:vp, textDivs:[]}).promise.then(function(){
        var end=document.createElement('div'); end.className='endOfContent'; tl.appendChild(end);
        placeQuotes(n); drawHighlights(n); res();
      }).catch(rej);
    };
    img.onerror=function(){ rej(new Error('그림을 불러오지 못했습니다.')); };
    img.src='data:image/jpeg;base64,'+pg.img;
  });
}
/* 미리 넣어 둔 메모의 인용문 위치를 글자 층에서 찾는다 */
function placeQuotes(n){
  var div=S.pageEls[n]; if(!div) return;
  var nodes=[], flat='', map=[];
  [].forEach.call(div.querySelectorAll('.textLayer span'), function(sp){
    var t=sp.firstChild; if(!t || t.nodeType!==3) return;
    for(var i=0;i<t.data.length;i++){ if(/\s/.test(t.data[i])) continue; flat+=t.data[i]; map.push([t,i]); }
  });
  MEMOS.concat(S.memos).forEach(function(m){
    if(m.page!==n || !m.quote || (m.rects && m.rects.length)) return;
    var key=m.quote.replace(/\s/g,''), at=flat.indexOf(key); if(at<0) return;
    var r=document.createRange(); r.setStart(map[at][0],map[at][1]); var e=map[at+key.length-1]; r.setEnd(e[0],e[1]+1);
    var b=div.getBoundingClientRect(), rects=[];
    [].forEach.call(r.getClientRects(), function(c){ if(c.width<1||c.height<1) return; rects.push([(c.left-b.left)/b.width,(c.top-b.top)/b.height,c.width/b.width,c.height/b.height]); });
    m.rects=mergeRects(rects);
  });
}
function watermark(ctx,w,h,dpr){
  var d=new Date(), stamp=(d.getMonth()+1)+'/'+d.getDate();
  var text=S.me+' 열람 · '+stamp;
  ctx.save();
  ctx.font=(15*dpr)+'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillStyle='rgba(61,90,128,0.10)';
  ctx.translate(w/2,h/2); ctx.rotate(-Math.PI/7);
  var stepX=240*dpr, stepY=110*dpr, R=Math.max(w,h);
  for(var y=-R;y<R;y+=stepY){ for(var x=-R;x<R;x+=stepX){ ctx.fillText(text, x+((y/stepY)%2?stepX/2:0), y); } }
  ctx.restore();
}

/* ---------- 하이라이트 ---------- */
function topLevel(){ return S.memos.filter(function(m){return !m.parent;}); }
function drawHighlights(only){
  S.pageEls.forEach(function(div,n){
    if(!div || (only && n!==only)) return;
    var layer=div.querySelector('.hl-layer'); layer.innerHTML='';
    topLevel().forEach(function(m){
      if(m.page!==n || !m.rects) return;
      m.rects.forEach(function(r){
        var h=document.createElement('div'); h.className='hl'+(S.active===m.id?' on':''); h.dataset.id=m.id;
        h.style.left=(r[0]*100)+'%'; h.style.top=(r[1]*100)+'%'; h.style.width=(r[2]*100)+'%'; h.style.height=(r[3]*100)+'%';
        layer.appendChild(h);
      });
    });
    if(S.draft && S.draft.page===n && S.draft.rects) S.draft.rects.forEach(function(r){
      var h=document.createElement('div'); h.className='hl on';
      h.style.left=(r[0]*100)+'%'; h.style.top=(r[1]*100)+'%'; h.style.width=(r[2]*100)+'%'; h.style.height=(r[3]*100)+'%';
      layer.appendChild(h);
    });
  });
}
function onTextClick(ev){
  var sel=window.getSelection(); if(sel && !sel.isCollapsed) return;
  var div=ev.currentTarget.parentNode; var n=Number(div.dataset.page); var b=div.getBoundingClientRect();
  var x=(ev.clientX-b.left)/b.width, y=(ev.clientY-b.top)/b.height;
  var hit=topLevel().filter(function(m){ return m.page===n && (m.rects||[]).some(function(r){ return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]-.004&&y<=r[1]+r[3]+.004; }); })[0];
  if(hit) activate(hit.id, false);
}
function activate(id, scrollPdf){
  S.active = (S.active===id && !scrollPdf) ? null : id; drawHighlights(); renderSide();
  var m=S.memos.filter(function(x){return x.id===id;})[0];
  if(S.active && scrollPdf && m && m.page && S.pageEls[m.page] && m.rects && m.rects[0]){
    var div=S.pageEls[m.page], v=document.getElementById('viewer');
    v.scrollTo({top: div.offsetTop + m.rects[0][1]*div.clientHeight - 120, behavior:'smooth'});
  }
  if(S.active && !scrollPdf){ var card=document.querySelector('.memo[data-id="'+id+'"]'); if(card) card.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ---------- 선택 → 메모 ---------- */
function currentPick(){
  var sel=window.getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  var range=sel.getRangeAt(0); var text=sel.toString().replace(/\s+/g,' ').trim(); if(!text) return null;
  var node=range.commonAncestorContainer; if(node.nodeType===3) node=node.parentNode;
  var div=node.closest ? node.closest('.page') : null;
  if(!div){ var s=range.startContainer; s=s.nodeType===3?s.parentNode:s; div=s.closest && s.closest('.page'); }
  if(!div) return null;
  var b=div.getBoundingClientRect(); var rects=[];
  [].forEach.call(range.getClientRects(), function(r){
    if(r.width<1||r.height<1) return;
    var x=Math.max(r.left,b.left), y=Math.max(r.top,b.top), x2=Math.min(r.right,b.right), y2=Math.min(r.bottom,b.bottom);
    if(x2<=x||y2<=y) return;
    rects.push([(x-b.left)/b.width,(y-b.top)/b.height,(x2-x)/b.width,(y2-y)/b.height]);
  });
  rects=mergeRects(rects).slice(0,60).map(function(r){return r.map(function(v){return Math.round(v*10000)/10000;});});
  return {page:Number(div.dataset.page), quote:text.slice(0,1000), rects:rects, box:range.getBoundingClientRect()};
}
function mergeRects(rs){
  rs.sort(function(a,b){ return a[1]-b[1] || a[0]-b[0]; });
  var out=[];
  rs.forEach(function(r){
    var last=out[out.length-1];
    if(last && Math.abs(last[1]-r[1])<last[3]*0.5 && r[0]<=last[0]+last[2]+0.02){
      var x2=Math.max(last[0]+last[2], r[0]+r[2]); var y1=Math.min(last[1],r[1]); var y2=Math.max(last[1]+last[3], r[1]+r[3]);
      last[0]=Math.min(last[0],r[0]); last[2]=x2-last[0]; last[1]=y1; last[3]=y2-y1;
    } else out.push(r.slice());
  });
  return out;
}
function onSel(){
  clearTimeout(onSel._t);
  onSel._t=setTimeout(function(){
    var p=currentPick(); var btn=document.getElementById('addBtn'); if(!btn) return;
    if(!p || !S.open){ btn.style.display='none'; return; }
    var v=document.getElementById('viewer'); var vb=v.getBoundingClientRect();
    btn.style.display='block';
    var top=p.box.bottom - vb.top + v.scrollTop + 6, left=p.box.left - vb.left + v.scrollLeft;
    btn.style.top=top+'px'; btn.style.left=Math.max(8, Math.min(left, v.clientWidth-130))+'px';
  },120);
}
function hideAdd(){ var b=document.getElementById('addBtn'); if(b) b.style.display='none'; }
function startDraftFromSelection(){
  var p=currentPick(); if(!p) return;
  S.draft={page:p.page, quote:p.quote, rects:p.rects, text:'', meta:newMeta()}; S.active=null;
  window.getSelection().removeAllRanges(); hideAdd(); drawHighlights(); renderSide();
  var ta=document.querySelector('.composer textarea'); if(ta) ta.focus();
}
function startWholeDraft(){ S.draft={page:null, quote:'', rects:null, text:'', meta:newMeta()}; S.active=null; drawHighlights(); renderSide(); var ta=document.querySelector('.composer textarea'); if(ta) ta.focus(); }

/* ---------- 메모 목록 ---------- */
function renderSide(){
  var side=document.getElementById('side'); if(!side) return;
  var tops=topLevel().slice().sort(function(a,b){
    var pa=a.page||9999, pb=b.page||9999; if(pa!==pb) return pa-pb;
    var ya=a.rects&&a.rects[0]?a.rects[0][1]:0, yb=b.rects&&b.rects[0]?b.rects[0][1]:0; return ya-yb || a.time-b.time;
  });
  var can = S.me && S.open;
  var h='<div class="side-head"><b>메모 '+tops.length+'개</b><button class="ghost" id="whole" type="button"'+(can?'':' disabled')+'>글 전체에 메모</button></div>';
  if(!S.me) h+='<div class="help">먼저 위쪽 <b>나는</b> 칸에서 내 닉네임을 골라 주세요. 메모마다 이 닉네임이 붙습니다.</div>';
  else if(!S.open) h+='<div class="help">지금은 메모를 쓸 수 있는 기간이 아닙니다. '+esc(periodText())+'</div>';
  else if(!tops.length && !S.draft) h+='<div class="help">글에서 문장을 드래그하면 <b>＋ 메모 달기</b> 버튼이 나타납니다. 글 전체에 대한 의견은 오른쪽 위 버튼으로 남길 수 있어요. 메모는 직접 써 주세요(붙여넣기 불가).</div>';
  if(S.draft){
    h+='<div class="composer">'+(S.draft.quote?'<p class="q">“'+esc(S.draft.quote)+'”</p>':'<p class="q">글 전체에 대한 메모</p>')+
       '<textarea placeholder="'+esc(S.me)+'(으)로 메모를 남깁니다">'+esc(S.draft.text)+'</textarea>'+
       '<p class="rule">붙여넣기는 되지 않습니다. 직접 써 주세요.</p>'+
       '<div class="row"><button class="ghost" id="cancel" type="button">취소</button><button class="primary" id="post" type="button">저장</button></div></div>';
  }
  if(!tops.length && !S.draft && S.me && S.open) h+='<div class="empty">아직 메모가 없습니다.</div>';
  tops.forEach(function(m){
    var replies=S.memos.filter(function(r){return r.parent===m.id;}).sort(function(a,b){return a.time-b.time;});
    h+='<div class="memo'+(S.active===m.id?' on':'')+'" data-id="'+esc(m.id)+'">'+
       (m.quote?'<p class="q">“'+esc(m.quote)+'”</p>':'')+
       metaHtml(m, true)+'<div class="body">'+esc(m.body)+'</div>'+
       replies.map(function(r){ return '<div class="reply">'+metaHtml(r,false)+'<div class="body">'+esc(r.body)+'</div></div>'; }).join('')+
       (S.active===m.id && can ? '<div class="replybox"><textarea placeholder="'+esc(S.me)+'(으)로 답글"></textarea><div class="row"><button class="primary rp" type="button">답글</button></div></div>'
        : (can ? '<div class="row" style="justify-content:flex-start"><button class="link open" type="button">답글 '+(replies.length?replies.length+'개 · ':'')+'달기</button></div>' : ''))+
       '</div>';
  });
  side.innerHTML=h;
  var w=side.querySelector('#whole'); if(w) w.onclick=startWholeDraft;
  var c=side.querySelector('#cancel'); if(c) c.onclick=function(){ S.draft=null; drawHighlights(); renderSide(); };
  var p=side.querySelector('#post'); if(p) p.onclick=postDraft;
  var ta=side.querySelector('.composer textarea');
  if(ta){ track(ta, S.draft.meta); ta.addEventListener('input', function(){ S.draft.text=ta.value; }); }
  [].forEach.call(side.querySelectorAll('.memo'), function(card){
    var id=card.getAttribute('data-id');
    card.addEventListener('click', function(e){ if(e.target.closest('textarea,button')) { if(e.target.classList.contains('open')) activate(id,true); return; } activate(id,true); });
    var box=card.querySelector('.replybox textarea');
    if(box){ var rm=S.replyMeta[id]=S.replyMeta[id]||newMeta(); track(box, rm); }
    var rp=card.querySelector('.rp'); if(rp) rp.onclick=function(){ postReply(id, box); };
  });
  [].forEach.call(side.querySelectorAll('.del'), function(b){ b.onclick=function(e){ e.stopPropagation();
    if(b.dataset.armed){ delMemo(b.getAttribute('data-id')); return; }
    b.dataset.armed='1'; b.textContent='정말 삭제할까요? 한 번 더 누르세요';
    setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; b.textContent='삭제'; } },4000); }; });
}
function metaHtml(m, top){
  return '<div class="meta"><span class="who'+(m.author===TEACHER_NICK?' t':'')+'">'+esc(m.author)+'</span><span>'+fmt(m.time)+'</span>'+
    (mine[m.id] && S.open ?'<button class="del" data-id="'+esc(m.id)+'" type="button">삭제</button>':'')+
    (top && m.page?'<span class="pg">'+m.page+'쪽</span>':'')+'</div>';
}

/* ---------- 저장 ---------- */
function postDraft(){
  var ta=document.querySelector('.composer textarea'); var body=ta.value.trim();
  if(!body) return toast('메모 내용을 써 주세요.');
  var btn=document.getElementById('post'); btn.disabled=true; btn.textContent='저장 중…';
  var essay=S.cur;
  call(post({action:'add', g:GROUP_TOKEN, m:{essay:essay, author:S.me, page:S.draft.page, quote:S.draft.quote, rects:S.draft.rects, body:body, meta:metaOut(S.draft.meta)}})).then(function(r){
    mine[r.id]=r.secret; save('mine',mine);
    if(S.cur!==essay) return;
    S.draft=null; S.memos=r.list; S.active=r.id; S.counts[essay]=topLevel().length; renderTabs(); drawHighlights(); renderSide(); toast('메모를 남겼습니다.');
  }).catch(function(e){ btn.disabled=false; btn.textContent='저장'; toast(e.message); });
}
function postReply(parent, ta){
  var body=ta.value.trim(); if(!body) return toast('답글 내용을 써 주세요.');
  var essay=S.cur, meta=S.replyMeta[parent]||newMeta();
  call(post({action:'add', g:GROUP_TOKEN, m:{essay:essay, author:S.me, parent:parent, body:body, meta:metaOut(meta)}})).then(function(r){
    mine[r.id]=r.secret; save('mine',mine); delete S.replyMeta[parent]; if(S.cur!==essay) return; S.memos=r.list; renderSide(); toast('답글을 남겼습니다.');
  }).catch(function(e){ toast(e.message); });
}
function delMemo(id){
  var essay=S.cur;
  call(post({action:'delete', g:GROUP_TOKEN, essay:essay, id:id, secret:mine[id]})).then(function(list){
    delete mine[id]; save('mine',mine); if(S.cur!==essay) return; S.memos=list; S.counts[essay]=topLevel().length; if(S.active===id) S.active=null; renderTabs(); drawHighlights(); renderSide();
  }).catch(function(e){ toast(e.message); });
}
function refresh(){
  var essay=S.cur;
  call(get({api:'comments', g:GROUP_TOKEN, essay:essay})).then(function(list){
    if(S.cur!==essay || S.draft) return;
    var box=document.querySelector('.replybox textarea'); if(box && box.value.trim()) return;
    S.memos=list; S.counts[essay]=topLevel().length; renderTabs(); drawHighlights(); renderSide();
  }).catch(function(){});
}

start();
})();
</script>
