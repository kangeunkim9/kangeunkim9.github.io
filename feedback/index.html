<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>분석글 상호 피드백</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f3f1ec; --paper:#fff; --ink:#22201c; --muted:#6f6a61; --line:#e2ddd3;
  --accent:#3d5a80; --accent-soft:#e6ecf4; --hl:rgba(255,206,64,.38); --hl-on:rgba(255,140,40,.45);
  --card:#fff; --danger:#a33;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:14px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .cnt{font-size:12px;opacity:.75;margin-left:4px}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.me select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;height:calc(100% - 57px)}
#viewer{overflow:auto;padding:20px 16px 80px}
#pages{max-width:820px;margin:0 auto}
.page{position:relative;margin:0 auto 18px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.page canvas{display:block;width:100%;height:auto}
.hl-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.hl{position:absolute;background:var(--hl);border-radius:2px;mix-blend-mode:multiply}
.hl.on{background:var(--hl-on)}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(61,90,128,.3)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}
#addBtn{position:absolute;z-index:30;display:none;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
aside{border-left:1px solid var(--line);background:#faf9f6;overflow:auto;padding:14px}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side-head b{font-size:15px}
.ghost{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:6px 14px;font-size:14px}
.primary:disabled{opacity:.5;cursor:default}
.composer{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:12px}
.composer .q,.memo .q{font-size:13px;color:var(--muted);border-left:3px solid #f0c340;padding:2px 8px;margin:0 0 8px;max-height:4.8em;overflow:hidden}
textarea{width:100%;min-height:84px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.memo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.memo.on{border-color:#e8932a;box-shadow:0 0 0 2px rgba(232,147,42,.25)}
.meta{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:4px}
.meta .who{font-weight:700;color:var(--ink)}
.meta .pg{margin-left:auto}
.body{white-space:pre-wrap;word-break:break-word}
.reply{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.replybox{margin-top:8px}
.replybox textarea{min-height:56px}
.link{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
.del{background:none;border:0;color:var(--danger);padding:0;font-size:12px;margin-left:6px}
.empty{color:var(--muted);font-size:14px;padding:20px 4px}
.notice{max-width:520px;margin:15vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center}
.loading{color:var(--muted);text-align:center;padding:40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;display:none}
.help{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px}
@media (max-width:860px){
  main{display:block;height:auto}
  #viewer{padding:12px 8px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .me{margin-left:0}
}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script>
// 메모판 서버(구글 Apps Script). 글과 메모는 선생님 구글 드라이브·시트에 있고, 이 페이지에는 저장되지 않는다.
var API = 'https://script.google.com/macros/s/AKfycbxiQqjmqh9doHTm10U8lmav9YQGkOyWXpEgBxLV8HziRGPsfoEt0HdXGs5Tx48LrflnWw/exec';
var GROUP_TOKEN = new URLSearchParams(location.search).get('g') || '';
</script>
<script>
(function(){
'use strict';
var S = { jo:null, essays:[], cur:null, pdf:null, memos:[], counts:{}, active:null, draft:null, me:'' , pageEls:[] };
var mine = load('mine') || {};          // {id: secret}

function load(k){ try{ return JSON.parse(localStorage.getItem('fb_'+k)); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem('fb_'+k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function call(fn){
  var a=[].slice.call(arguments,1), req;
  if(fn==='getGroup') req=get({api:'group', g:a[0]});
  else if(fn==='getPdf') req=get({api:'pdf', g:a[0], id:a[1]});
  else if(fn==='getComments') req=get({api:'comments', g:a[0], essay:a[1]});
  else if(fn==='addComment') req=post({action:'add', g:a[0], m:a[1]});
  else if(fn==='deleteComment') req=post({action:'delete', g:a[0], essay:a[1], id:a[2], secret:a[3]});
  else return Promise.reject(new Error('알 수 없는 요청'));
  return req.then(function(r){ if(!r.ok) throw new Error('서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.'); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'오류가 났습니다.'); return j.data; });
}
function get(q){ return fetch(API+'?'+new URLSearchParams(q).toString(), {redirect:'follow'}); }
function post(b){ return fetch(API, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(b)}); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},2600); }
function fmt(ms){ if(!ms) return ''; var d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

/* ---------- 시작 ---------- */
function start(){
  if(!GROUP_TOKEN){ return notice('조별 링크로 들어와 주세요.','선생님이 나눠 준 우리 조 링크를 열면 같은 조 친구들의 글을 볼 수 있습니다.'); }
  call('getGroup', GROUP_TOKEN).then(function(g){
    S.jo=g.jo; S.essays=g.essays;
    var saved = load('me_'+S.jo);
    S.me = (saved && g.essays.some(function(e){return e.nick===saved;})) ? saved : '';
    shell();
    var last = load('cur_'+S.jo);
    var first = g.essays.filter(function(e){return e.nick===last;})[0] || g.essays.filter(function(e){return e.nick!==S.me;})[0] || g.essays[0];
    if(first) openEssay(first.nick);
  }).catch(function(e){ notice('들어갈 수 없습니다', e.message); });
}
function notice(t,m){ document.getElementById('app').innerHTML='<div class="notice"><h2>'+esc(t)+'</h2><p>'+esc(m)+'</p></div>'; }

function shell(){
  var opts = '<option value="">닉네임 선택</option>' + S.essays.map(function(e){ return '<option'+(e.nick===S.me?' selected':'')+'>'+esc(e.nick)+'</option>'; }).join('');
  document.getElementById('app').innerHTML =
    '<header><h1>'+S.jo+'조 상호 피드백</h1>'+
    '<div class="tabs" id="tabs" role="tablist"></div>'+
    '<label class="me">나는 <select id="me">'+opts+'</select></label></header>'+
    '<main><section id="viewer"><div id="pages"></div><button id="addBtn" type="button">＋ 메모 달기</button></section>'+
    '<aside id="side"></aside></main>';
  document.getElementById('me').addEventListener('change', function(){ S.me=this.value; save('me_'+S.jo,S.me); renderTabs(); renderSide(); });
  document.getElementById('addBtn').addEventListener('mousedown', function(e){ e.preventDefault(); });
  document.getElementById('addBtn').addEventListener('click', startDraftFromSelection);
  document.addEventListener('selectionchange', onSel);
  document.getElementById('viewer').addEventListener('scroll', function(){ hideAdd(); });
  renderTabs();
  setInterval(function(){ if(S.cur && !document.hidden && !S.draft) refresh(); }, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.cur && !S.draft) refresh(); });
}
function renderTabs(){
  var el=document.getElementById('tabs');
  el.innerHTML = S.essays.map(function(e){
    var c=S.counts[e.nick]; var mineMark = e.nick===S.me ? ' (내 글)' : '';
    return '<button class="tab" role="tab" aria-selected="'+(e.nick===S.cur)+'" data-n="'+esc(e.nick)+'">'+esc(e.nick)+mineMark+(c!=null?'<span class="cnt">'+c+'</span>':'')+'</button>';
  }).join('');
  [].forEach.call(el.querySelectorAll('.tab'), function(b){ b.onclick=function(){ openEssay(b.getAttribute('data-n')); }; });
}

/* ---------- PDF ---------- */
function b64ToBytes(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
var workerReady = null;
function ensureWorker(){
  if(workerReady) return workerReady;
  var src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  workerReady = fetch(src).then(function(r){ if(!r.ok) throw new Error('worker'); return r.text(); }).then(function(code){
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  }).catch(function(){
    // 별도 작업 스레드를 못 쓰는 환경이면 같은 화면에서 처리한다
    return new Promise(function(res){ var sc=document.createElement('script'); sc.src=src; sc.onload=sc.onerror=function(){ pdfjsLib.GlobalWorkerOptions.workerSrc=src; res(); }; document.head.appendChild(sc); });
  });
  return workerReady;
}
function openEssay(nick){
  var e=S.essays.filter(function(x){return x.nick===nick;})[0]; if(!e) return;
  S.cur=nick; S.active=null; S.draft=null; S.memos=[]; save('cur_'+S.jo,nick);
  renderTabs(); renderSide();
  var pages=document.getElementById('pages'); pages.innerHTML='<div class="loading">글을 불러오는 중…</div>';
  document.getElementById('viewer').scrollTop=0;
  Promise.all([ensureWorker(), call('getPdf',GROUP_TOKEN,e.id), call('getComments',GROUP_TOKEN,nick)]).then(function(r){
    if(S.cur!==nick) return;
    S.memos=r[2]; S.counts[nick]=topLevel().length; renderTabs(); renderSide();
    return pdfjsLib.getDocument({data:b64ToBytes(r[1]), cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked:true}).promise.then(function(pdf){
      if(S.cur!==nick) return; S.pdf=pdf; return renderPages(pdf, nick);
    });
  }).catch(function(err){ pages.innerHTML='<div class="loading">불러오지 못했습니다: '+esc(err.message)+'</div>'; });
}
function renderPages(pdf, nick){
  var wrap=document.getElementById('pages'); wrap.innerHTML=''; S.pageEls=[];
  var width = Math.min(wrap.clientWidth || 800, 820);
  var chain=Promise.resolve();
  for(var i=1;i<=pdf.numPages;i++) (function(n){
    chain=chain.then(function(){ return pdf.getPage(n); }).then(function(page){
      if(S.cur!==nick) return;
      var base=page.getViewport({scale:1}); var scale=width/base.width; var vp=page.getViewport({scale:scale});
      var div=document.createElement('div'); div.className='page'; div.dataset.page=n;
      div.style.width=vp.width+'px'; div.style.height=vp.height+'px'; div.style.setProperty('--scale-factor', scale);
      var dpr=Math.min(window.devicePixelRatio||1,2);
      var cv=document.createElement('canvas'); cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
      var hl=document.createElement('div'); hl.className='hl-layer';
      var tl=document.createElement('div'); tl.className='textLayer';
      div.appendChild(cv); div.appendChild(hl); div.appendChild(tl); wrap.appendChild(div); S.pageEls[n]=div;
      tl.addEventListener('click', onTextClick);
      return page.render({canvasContext:cv.getContext('2d'), viewport:vp, transform: dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise.then(function(){
        return page.getTextContent();
      }).then(function(tc){
        var task=pdfjsLib.renderTextLayer({textContentSource:tc, container:tl, viewport:vp, textDivs:[]});
        return task.promise;
      }).then(function(){
        var end=document.createElement('div'); end.className='endOfContent'; tl.appendChild(end);
        drawHighlights(n);
      });
    });
  })(i);
  return chain;
}

/* ---------- 하이라이트 ---------- */
function topLevel(){ return S.memos.filter(function(m){return !m.parent;}); }
function drawHighlights(only){
  S.pageEls.forEach(function(div,n){
    if(!div || (only && n!==only)) return;
    var layer=div.querySelector('.hl-layer'); layer.innerHTML='';
    topLevel().forEach(function(m){
      if(m.page!==n || !m.rects) return;
      m.rects.forEach(function(r){
        var h=document.createElement('div'); h.className='hl'+(S.active===m.id?' on':''); h.dataset.id=m.id;
        h.style.left=(r[0]*100)+'%'; h.style.top=(r[1]*100)+'%'; h.style.width=(r[2]*100)+'%'; h.style.height=(r[3]*100)+'%';
        layer.appendChild(h);
      });
    });
    if(S.draft && S.draft.page===n && S.draft.rects) S.draft.rects.forEach(function(r){
      var h=document.createElement('div'); h.className='hl on';
      h.style.left=(r[0]*100)+'%'; h.style.top=(r[1]*100)+'%'; h.style.width=(r[2]*100)+'%'; h.style.height=(r[3]*100)+'%';
      layer.appendChild(h);
    });
  });
}
function onTextClick(ev){
  var sel=window.getSelection(); if(sel && !sel.isCollapsed) return;
  var div=ev.currentTarget.parentNode; var n=Number(div.dataset.page); var b=div.getBoundingClientRect();
  var x=(ev.clientX-b.left)/b.width, y=(ev.clientY-b.top)/b.height;
  var hit=topLevel().filter(function(m){ return m.page===n && (m.rects||[]).some(function(r){ return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]-.004&&y<=r[1]+r[3]+.004; }); })[0];
  if(hit) activate(hit.id, false);
}
function activate(id, scrollPdf){
  S.active = (S.active===id && !scrollPdf) ? null : id; drawHighlights(); renderSide();
  var m=S.memos.filter(function(x){return x.id===id;})[0];
  if(S.active && scrollPdf && m && m.page && S.pageEls[m.page] && m.rects && m.rects[0]){
    var div=S.pageEls[m.page], v=document.getElementById('viewer');
    v.scrollTo({top: div.offsetTop + m.rects[0][1]*div.clientHeight - 120, behavior:'smooth'});
  }
  if(S.active && !scrollPdf){ var card=document.querySelector('.memo[data-id="'+id+'"]'); if(card) card.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ---------- 선택 → 메모 ---------- */
function currentPick(){
  var sel=window.getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  var range=sel.getRangeAt(0); var text=sel.toString().replace(/\s+/g,' ').trim(); if(!text) return null;
  var node=range.commonAncestorContainer; if(node.nodeType===3) node=node.parentNode;
  var div=node.closest ? node.closest('.page') : null;
  if(!div){ var s=range.startContainer; s=s.nodeType===3?s.parentNode:s; div=s.closest && s.closest('.page'); }
  if(!div) return null;
  var b=div.getBoundingClientRect(); var rects=[];
  [].forEach.call(range.getClientRects(), function(r){
    if(r.width<1||r.height<1) return;
    var x=Math.max(r.left,b.left), y=Math.max(r.top,b.top), x2=Math.min(r.right,b.right), y2=Math.min(r.bottom,b.bottom);
    if(x2<=x||y2<=y) return;
    rects.push([(x-b.left)/b.width,(y-b.top)/b.height,(x2-x)/b.width,(y2-y)/b.height]);
  });
  rects=mergeRects(rects).slice(0,60).map(function(r){return r.map(function(v){return Math.round(v*10000)/10000;});});
  return {page:Number(div.dataset.page), quote:text.slice(0,1000), rects:rects, box:range.getBoundingClientRect()};
}
function mergeRects(rs){
  rs.sort(function(a,b){ return a[1]-b[1] || a[0]-b[0]; });
  var out=[];
  rs.forEach(function(r){
    var last=out[out.length-1];
    if(last && Math.abs(last[1]-r[1])<last[3]*0.5 && r[0]<=last[0]+last[2]+0.02){
      var x2=Math.max(last[0]+last[2], r[0]+r[2]); var y1=Math.min(last[1],r[1]); var y2=Math.max(last[1]+last[3], r[1]+r[3]);
      last[0]=Math.min(last[0],r[0]); last[2]=x2-last[0]; last[1]=y1; last[3]=y2-y1;
    } else out.push(r.slice());
  });
  return out;
}
function onSel(){
  clearTimeout(onSel._t);
  onSel._t=setTimeout(function(){
    var p=currentPick(); var btn=document.getElementById('addBtn'); if(!btn) return;
    if(!p){ btn.style.display='none'; return; }
    var v=document.getElementById('viewer'); var vb=v.getBoundingClientRect();
    btn.style.display='block';
    var top=p.box.bottom - vb.top + v.scrollTop + 6, left=p.box.left - vb.left + v.scrollLeft;
    btn.style.top=top+'px'; btn.style.left=Math.max(8, Math.min(left, v.clientWidth-130))+'px';
  },120);
}
function hideAdd(){ var b=document.getElementById('addBtn'); if(b) b.style.display='none'; }
function startDraftFromSelection(){
  var p=currentPick(); if(!p) return;
  S.draft={page:p.page, quote:p.quote, rects:p.rects}; S.active=null;
  window.getSelection().removeAllRanges(); hideAdd(); drawHighlights(); renderSide();
  var ta=document.querySelector('.composer textarea'); if(ta) ta.focus();
}
function startWholeDraft(){ S.draft={page:null, quote:'', rects:null}; S.active=null; drawHighlights(); renderSide(); var ta=document.querySelector('.composer textarea'); if(ta) ta.focus(); }

/* ---------- 메모 목록 ---------- */
function renderSide(){
  var side=document.getElementById('side'); if(!side) return;
  var keepDraft = side.querySelector('.composer textarea'); var draftText = keepDraft ? keepDraft.value : (S.draft && S.draft.text) || '';
  var tops=topLevel().slice().sort(function(a,b){
    var pa=a.page||9999, pb=b.page||9999; if(pa!==pb) return pa-pb;
    var ya=a.rects&&a.rects[0]?a.rects[0][1]:0, yb=b.rects&&b.rects[0]?b.rects[0][1]:0; return ya-yb || a.time-b.time;
  });
  var h='<div class="side-head"><b>메모 '+tops.length+'개</b><button class="ghost" id="whole" type="button">글 전체에 메모</button></div>';
  if(!S.me) h+='<div class="help">먼저 위쪽 <b>나는</b> 칸에서 내 닉네임을 골라 주세요. 메모마다 이 닉네임이 붙습니다.</div>';
  else if(!tops.length && !S.draft) h+='<div class="help">글에서 문장을 드래그하면 <b>＋ 메모 달기</b> 버튼이 나타납니다. 글 전체에 대한 의견은 오른쪽 위 버튼으로 남길 수 있어요.</div>';
  if(S.draft){
    h+='<div class="composer">'+(S.draft.quote?'<p class="q">“'+esc(S.draft.quote)+'”</p>':'<p class="q">글 전체에 대한 메모</p>')+
       '<textarea placeholder="'+(S.me?esc(S.me)+'(으)로 메모를 남깁니다':'먼저 닉네임을 골라 주세요')+'">'+esc(draftText)+'</textarea>'+
       '<div class="row"><button class="ghost" id="cancel" type="button">취소</button><button class="primary" id="post" type="button"'+(S.me?'':' disabled')+'>저장</button></div></div>';
  }
  if(!tops.length && !S.draft && S.me) h+='<div class="empty">아직 메모가 없습니다.</div>';
  tops.forEach(function(m){
    var replies=S.memos.filter(function(r){return r.parent===m.id;}).sort(function(a,b){return a.time-b.time;});
    h+='<div class="memo'+(S.active===m.id?' on':'')+'" data-id="'+esc(m.id)+'">'+
       (m.quote?'<p class="q">“'+esc(m.quote)+'”</p>':'')+
       metaHtml(m, true)+'<div class="body">'+esc(m.body)+'</div>'+
       replies.map(function(r){ return '<div class="reply">'+metaHtml(r,false)+'<div class="body">'+esc(r.body)+'</div></div>'; }).join('')+
       (S.active===m.id ? '<div class="replybox"><textarea placeholder="'+(S.me?esc(S.me)+'(으)로 답글':'먼저 닉네임을 골라 주세요')+'"></textarea><div class="row"><button class="primary rp" type="button"'+(S.me?'':' disabled')+'>답글</button></div></div>'
                        : '<div class="row" style="justify-content:flex-start"><button class="link open" type="button">답글 '+(replies.length?replies.length+'개 · ':'')+'달기</button></div>')+
       '</div>';
  });
  side.innerHTML=h;
  side.querySelector('#whole').onclick=startWholeDraft;
  var c=side.querySelector('#cancel'); if(c) c.onclick=function(){ S.draft=null; drawHighlights(); renderSide(); };
  var p=side.querySelector('#post'); if(p) p.onclick=postDraft;
  var ta=side.querySelector('.composer textarea'); if(ta) ta.oninput=function(){ S.draft.text=ta.value; };
  [].forEach.call(side.querySelectorAll('.memo'), function(card){
    var id=card.getAttribute('data-id');
    card.addEventListener('click', function(e){ if(e.target.closest('textarea,button')) { if(e.target.classList.contains('open')) activate(id,true); return; } activate(id,true); });
    var rp=card.querySelector('.rp'); if(rp) rp.onclick=function(){ postReply(id, card.querySelector('.replybox textarea')); };
  });
  [].forEach.call(side.querySelectorAll('.del'), function(b){ b.onclick=function(e){ e.stopPropagation();
    if(b.dataset.armed){ delMemo(b.getAttribute('data-id')); return; }
    b.dataset.armed='1'; b.textContent='정말 삭제할까요? 한 번 더 누르세요';
    setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; b.textContent='삭제'; } },4000); }; });
}
function metaHtml(m, top){
  return '<div class="meta"><span class="who">'+esc(m.author)+'</span><span>'+fmt(m.time)+'</span>'+
    (mine[m.id]?'<button class="del" data-id="'+esc(m.id)+'" type="button">삭제</button>':'')+
    (top && m.page?'<span class="pg">'+m.page+'쪽</span>':'')+'</div>';
}

/* ---------- 저장 ---------- */
function postDraft(){
  var ta=document.querySelector('.composer textarea'); var body=ta.value.trim();
  if(!S.me) return toast('먼저 닉네임을 골라 주세요.');
  if(!body) return toast('메모 내용을 써 주세요.');
  var btn=document.getElementById('post'); btn.disabled=true; btn.textContent='저장 중…';
  var essay=S.cur;
  call('addComment',GROUP_TOKEN,{essay:essay, author:S.me, page:S.draft.page, quote:S.draft.quote, rects:S.draft.rects, body:body}).then(function(r){
    mine[r.id]=r.secret; save('mine',mine);
    if(S.cur!==essay) return;
    S.draft=null; S.memos=r.list; S.active=r.id; S.counts[essay]=topLevel().length; renderTabs(); drawHighlights(); renderSide(); toast('메모를 남겼습니다.');
  }).catch(function(e){ btn.disabled=false; btn.textContent='저장'; toast(e.message); });
}
function postReply(parent, ta){
  var body=ta.value.trim(); if(!S.me) return toast('먼저 닉네임을 골라 주세요.'); if(!body) return toast('답글 내용을 써 주세요.');
  var essay=S.cur;
  call('addComment',GROUP_TOKEN,{essay:essay, author:S.me, parent:parent, body:body}).then(function(r){
    mine[r.id]=r.secret; save('mine',mine); if(S.cur!==essay) return; S.memos=r.list; renderSide(); toast('답글을 남겼습니다.');
  }).catch(function(e){ toast(e.message); });
}
function delMemo(id){
  var essay=S.cur;
  call('deleteComment',GROUP_TOKEN,essay,id,mine[id]).then(function(list){
    delete mine[id]; save('mine',mine); if(S.cur!==essay) return; S.memos=list; S.counts[essay]=topLevel().length; if(S.active===id) S.active=null; renderTabs(); drawHighlights(); renderSide();
  }).catch(function(e){ toast(e.message); });
}
function refresh(){
  var essay=S.cur;
  call('getComments',GROUP_TOKEN,essay).then(function(list){
    if(S.cur!==essay || S.draft) return;
    var box=document.querySelector('.replybox textarea'); if(box && box.value.trim()) return;
    S.memos=list; S.counts[essay]=topLevel().length; renderTabs(); drawHighlights(); renderSide();
  }).catch(function(){});
}

start();
})();
</script>
</body>
</html>
